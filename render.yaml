# @format

services:
  - type: web
    name: taskflow-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://taskflow-three-sage-23.vercel.app
      - key: DB_HOST
        fromDatabase:
          name: taskflow-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: taskflow-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: taskflow-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: taskflow-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: taskflow-db
          property: password
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"

databases:
  - name: taskflow-db
    databaseName: taskflow
    user: taskflow
    plan: free
    region: oregon
    ipAllowList: []
